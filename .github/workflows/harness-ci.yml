# Written by the harness for plan 25: harness ci on each push to a pull request of a child into plan/p25.
# Locked with the acceptance tests: never edit it by hand; a child that changes it is refused.
name: harness ci p25
'on':
  pull_request:
    branches: ['plan/p25']
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  harness-ci:
    if: startsWith(github.head_ref, 'orch/p25/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Get the harness at 53a893d8844a
        run: |
          git clone --quiet https://github.com/gunnybd02/aisdlc "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" checkout --quiet 53a893d8844a7eb23146199f989fc7a8a08933c7
      - name: harness ci
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$RUNNER_TEMP/harness/.claude/harness/entry/cli.py" ci --base "$GITHUB_BASE_REF" --head "$GITHUB_HEAD_REF"
      - name: tests of hello
        if: ${{ !cancelled() && github.head_ref == 'orch/p25/hello' && steps.ci.outputs.code == 'yes' }}
        run: |
          python -m unittest discover -s orch-probe -t orch-probe
