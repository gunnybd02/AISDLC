# Written by the harness for plan 29: harness ci on each push to a pull request of a child into plan/p29.
# Locked with the acceptance tests: never edit it by hand; a child that changes it is refused.
name: harness ci p29
'on':
  pull_request:
    branches: ['plan/p29']
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  harness-ci:
    if: startsWith(github.head_ref, 'orch/p29/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Get the harness at eaf4130fe3f9
        run: |
          git clone --quiet https://github.com/gunnybd02/aisdlc "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" checkout --quiet eaf4130fe3f96af2700b1d91a16cf301cd82b22f
      - name: harness ci
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$RUNNER_TEMP/harness/.claude/harness/entry/cli.py" ci --base "$GITHUB_BASE_REF" --head "$GITHUB_HEAD_REF" --sha "${{ github.event.pull_request.head.sha }}"
      - name: tests of hello
        if: ${{ !cancelled() && github.head_ref == 'orch/p29/hello' && steps.ci.outputs.code == 'yes' }}
        run: |
          python -m unittest discover -s orch-probe -t orch-probe
