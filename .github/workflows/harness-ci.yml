# Written by the harness for plan 27: harness ci on each push to a pull request of a child into plan/p27.
# Locked with the acceptance tests: never edit it by hand; a child that changes it is refused.
name: harness ci p27
'on':
  pull_request:
    branches: ['plan/p27']
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  harness-ci:
    if: startsWith(github.head_ref, 'orch/p27/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Get the harness at ab6576796c7e
        run: |
          git clone --quiet https://github.com/gunnybd02/aisdlc "$RUNNER_TEMP/harness"
          git -C "$RUNNER_TEMP/harness" checkout --quiet ab6576796c7e0935e185e852740428d904dc3042
      - name: harness ci
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python "$RUNNER_TEMP/harness/.claude/harness/entry/cli.py" ci --base "$GITHUB_BASE_REF" --head "$GITHUB_HEAD_REF"
      - name: tests of hello
        if: ${{ !cancelled() && github.head_ref == 'orch/p27/hello' && steps.ci.outputs.code == 'yes' }}
        run: |
          python -m unittest discover -s orch-probe -t orch-probe
